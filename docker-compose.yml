services:
  ijaraly-api:
    container_name: ijaraly-api
    restart: always
    image: node:20.10.0
    ports:
      - 4001:3007
    volumes:
      - ./:/usr/src/ijaraly
    working_dir: /usr/src/ijaraly

    networks:
      - monorepo-network
    #For Production
    command: bash -c "rm -rf dist && npm install && npm run build && npm run start:prod"

  ijaraly-batch:
    container_name: ijaraly-batch
    restart: unless-stopped
    image: node:20.10.0
    ports:
      - 4002:3008
    volumes:
      - ./:/usr/src/ijaraly
    working_dir: /usr/src/ijaraly

    networks:
      - monorepo-network
    #For Production
    command: bash -c "npm install && npm run build && npm run start:prod:batch"

networks:
  monorepo-network:
    driver: bridge
